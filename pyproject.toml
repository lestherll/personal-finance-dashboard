[project]
name = "personal-finance-dashboard"
version = "0.1.0"
description = "Personal finance system with medallion data lake architecture"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.0.0",
    "pyarrow>=16.0.0",
    "celery>=5.3.4",
    "redis>=5.0.1",
    "pydantic>=2.5.2",
    "python-dateutil>=2.8.2",
    "click>=8.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-cov==4.1.0",
    "black==23.12.1",
    "ruff==0.1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --strict-markers"
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "e2e: end-to-end tests",
    "performance: performance tests",
]
